<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>la Nonna — Pastas frescas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Montserrat:wght@400;500;600;700&family=Parisienne&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <a class="logo" href="index.html">
            "la Nonna"
        </a>

        <button class="menu-btn" aria-label="Menú">
            <i></i>
            <i></i>
            <i></i>
        </button>

    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <!-- HERO -->
        <section class="hero">

            <div>
                <p class="eyebrow">
                    PASTAS FRESCAS
                </p>

                <h1>
                    LA NONNA
                </h1>

                <p class="hero-text">
                    Hechas con cariño, como en casa.
                </p>
            </div>


            <!-- IMAGEN PRINCIPAL -->
            <div class="frame">
                <img
                    src="assets/placeholder.png"
                    alt="Imagen principal"
                >
            </div>

        </section>


        <!-- HORARIOS -->
        <section class="hours">

            <h2>
                Horarios Tienda
            </h2>

            <div>
                <span>
                    Lunes — Viernes
                </span>

                <strong>
                    09:00 — 19:00
                </strong>
            </div>

            <div>
                <span>
                    Sábado
                </span>

                <strong>
                    10:00 — 15:00
                </strong>
            </div>

        </section>


        <!-- PRODUCTOS -->
        <section class="products-section">

            <div class="section-heading">

                <h2>
                    Productos
                </h2>

                <a
                    href="productos.html"
                    aria-label="Ver todos los productos"
                >
                    →
                </a>

            </div>


            <!-- CARRUSEL -->
            <div class="product-carousel">

                <a
                    class="product-card"
                    href="productos.html"
                >
                    <div>
                        <img
                            src="assets/placeholder.png"
                            alt="Ravioles"
                        >
                    </div>

                    <h3>
                        Ravioles
                    </h3>
                </a>


                <a
                    class="product-card"
                    href="productos.html"
                >
                    <div>
                        <img
                            src="assets/placeholder.png"
                            alt="Fettuccine"
                        >
                    </div>

                    <h3>
                        Fettuccine
                    </h3>
                </a>


                <a
                    class="product-card"
                    href="productos.html"
                >
                    <div>
                        <img
                            src="assets/placeholder.png"
                            alt="Ñoquis"
                        >
                    </div>

                    <h3>
                        Ñoquis
                    </h3>
                </a>


                <a
                    class="product-card"
                    href="productos.html"
                >
                    <div>
                        <img
                            src="assets/placeholder.png"
                            alt="Lasaña"
                        >
                    </div>

                    <h3>
                        Lasaña
                    </h3>
                </a>

            </div>

        </section>


        <!-- BOTÓN PÁGINA PRINCIPAL -->
        <a
            class="home-button"
            href="index.html"
        >
            P. Principal
        </a>

    </main>


    <script src="script.js"></script>

</body>

</html>
