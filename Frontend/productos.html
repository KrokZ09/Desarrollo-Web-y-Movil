<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Productos — la Nonna</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Montserrat:wght@400;500;600;700&family=Parisienne&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="extras.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <a class="logo" href="index.html">"la Nonna"</a>

        <button class="menu-btn" aria-label="Menú">
            <i></i>
            <i></i>
            <i></i>
        </button>
    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="store-page">

        <!-- ENCABEZADO -->
        <section class="store-heading">
            <p class="eyebrow">LA TIENDA</p>

            <h1>Productos</h1>

            <p>
                Elige tus pastas y descubre sus detalles.
            </p>
        </section>


        <!-- CATÁLOGO: las tarjetas las crea script.js con los datos del backend -->
        <section class="catalog" id="catalog">
            <p class="status-msg">Cargando productos...</p>
        </section>


        <!-- VOLVER AL INICIO -->
        <a
            class="home-button"
            href="index.html"
        >
            P. Principal
        </a>

    </main>


    <!-- MODAL DEL PRODUCTO -->
    <div
        class="product-modal"
        id="productModal"
    >

        <div class="modal-box">

            <button
                class="modal-close"
                aria-label="Cerrar"
            >
                ×
            </button>

            <img
                id="modalImage"
                src="assets/placeholder.png"
                alt=""
            >

            <div class="modal-info">

                <p class="eyebrow">
                    PRODUCTO
                </p>

                <h2 id="modalTitle"></h2>

                <p id="modalDescription"></p>

                <strong id="modalPrice"></strong>

                <button class="buy-btn">
                    Agregar a compra
                </button>

            </div>

        </div>

    </div>


    <script src="api.js"></script>
    <script src="menu.js"></script>
    <script src="script.js"></script>

</body>

</html>
